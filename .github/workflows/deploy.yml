name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı anda tek yayın; yeni push eskisini iptal etmez, sıraya girer.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      - name: Derle
        run: npm run build

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Artefaktı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
